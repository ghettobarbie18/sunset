<!DOCTYPE html>
<html lang="en">
<head>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunset Template</title>

<style>
/* MAIN TEMPLATE */
.template {
    position: relative;
    width: 500px;
    height: 600px;
    margin: auto;
    overflow: hidden;
    background: #000;
}

/* VIDEO BACKGROUND */
.template-video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    z-index: 0;
    pointer-events: none;
}

/* CONTENT ABOVE VIDEO */
.template-content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
}

/* TITLE */
.template-title {
    font-size: 60px;
    color: white;
    text-align: center;
}

/* TEXTBOX */
.template-textbox {
    width: 350px;
    height: 300px;
    margin: 30px auto;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.65);
    color: white;
}
</style>
</head>


<body>
<div class="template">

    <video class="template-video" autoplay muted loop playsinline>
        <source src="https://raw.githubusercontent.com/ghettobarbie18/sunset/refs/heads/main/lolaf_by_chernotrop_dg0338o.gif" type="video/mp4">
    </video>

    <div class="template-content">
        <div class="template-title">Your Title</div>

        <div class="template-textbox">
            Your text goes here.
        </div>
    </div>

</div>
</body>
</html>
