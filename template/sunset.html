<!DOCTYPE html>
<html lang="en">
<head>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunset Template</title>

<style>
/* MAIN TEMPLATE */
.template {
    position: relative;
    width: 800px;
    height: 550px;
    margin: auto;
    overflow: hidden;
}

/* GIF BACKGROUND */
.sunset-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background-image: url("https://raw.githubusercontent.com/ghettobarbie18/sunset/refs/heads/main/lolaf_by_chernotrop_dg0338o.gif");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;

    z-index: 0;
    pointer-events: none;
}

/* CONTENT ABOVE GIF */
.template-content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
}

/* TITLE */
.template-title {
    position: relative;
    z-index: 3;
    font-size: 60px;
    color: white;
    text-align: center;
}

/* TEXTBOX */
.template-textbox {
    position: relative;
    z-index: 3;
    width: 350px;
    height: 300px;
    margin: 30px auto;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.65);
    color: white;
}
</style>
</head>


<body>
<div class="template">

    <div class="sunset-image"></div>

    <div class="template-content">

        <div class="template-title">
            Your Title
        </div>

        <div class="template-textbox">
            Your text goes here.
        </div>

    </div>

</div>
</body>
</html>
